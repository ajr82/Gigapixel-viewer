name: Build Mac DMG

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 PyQt6-WebEngine openslide-python tifffile zarr imagecodecs Pillow pyinstaller

    - name: Extract OpenSlide Binary
      run: |
        mkdir openslide_mac_bin
        tar -xf openslide-bin-4.0.1.2-macos-arm64-x86_64.tar.xz -C openslide_mac_bin --strip-components=1

    - name: Build Application with PyInstaller
      run: |
        pyinstaller --name "Gigapixel Viewer" \
        --windowed \
        --icon=NONE \
        --add-data "openslide_mac_bin:openslide_mac_bin" \
        --hidden-import imagecodecs \
        --hidden-import tifffile \
        --hidden-import zarr \
        --hidden-import numcodecs \
        --collect-all imagecodecs \
        --collect-all zarr \
        viewer.py

    - name: Create DMG Disk Image
      run: |
        # Use macOS's built-in hdiutil to create a highly compatible DMG package
        hdiutil create -volname "Gigapixel Viewer" -srcfolder "dist/Gigapixel Viewer.app" -ov -format UDZO GigapixelViewer-Mac.dmg

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: GigapixelViewer-Mac-DMG
        path: GigapixelViewer-Mac.dmg
