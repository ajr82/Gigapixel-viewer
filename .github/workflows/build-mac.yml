name: Build macOS App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' 

    - name: Install OpenSlide
      run: brew install openslide

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller imagecodecs tifffile zarr numcodecs

    - name: Build with PyInstaller
      run: |
        pyinstaller --windowed --noconfirm --name "GigapixelViewer" \
        --hidden-import=imagecodecs \
        --hidden-import=tifffile \
        --hidden-import=zarr \
        --hidden-import=numcodecs \
        --collect-all=imagecodecs \
        --collect-all=zarr \
        viewer.py

    - name: Package into DMG
      run: |
        cd dist
        hdiutil create -volname "GigapixelViewer" -srcfolder "GigapixelViewer.app" -ov -format UDZO GigapixelViewer-Mac.dmg

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GigapixelViewer-Mac
        path: dist/GigapixelViewer-Mac.dmg
